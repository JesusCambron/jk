<section class="hero" [class.is-active]="isStarted" aria-label="Invitación de boda">
  <div class="bg" role="img" aria-label="Fondo de invitación"
    [ngStyle]="{ 'background-image': 'url(' + config.hero.backgroundImage + ')' }"></div>

  <div class="overlay" aria-hidden="true"></div>

  <div class="content">
    <h1 class="names">
      @for (wordObj of coupleNamesWords; track $index) {
      <span class="random-word">
        @for (item of wordObj.letters; track $index) {
        <span class="random-letter" [style.animation-delay]="item.delay + 's'">{{ item.char }}</span>
        }
      </span>
      }
    </h1>
    <p class="subtitle">
      @for (wordObj of subtitleWords; track $index) {
      <span class="random-word">
        @for (item of wordObj.letters; track $index) {
        <span class="random-letter" [style.animation-delay]="item.delay + 's'">{{ item.char }}</span>
        }
      </span>
      }
    </p>
  </div>

</section>
